{%extends "index.html" %}


{%block post%}

{%block topic%}
{%endblock%}

<!--Posts should go here-->

<div id="postsSection">
  {%for post in posts%}
    <div class = "post">
      <h3>{{post.subject}}</h3>
      <p>{{post.post}}</p>
      <p>Posted by {{post.name}}</p>
    </div>
  {%endfor%}
</div>
<div id="post">
  <label>Name:</label><br />
  <input id="name" />
  <br />
  <label>Subject:</label><br />
  <input id="subject" />
  <br />
  <label>Post:</label><br />
  <textarea id="para" cols="50" rows="10"></textarea>
  <br />
  <!--Button should go here-->
  {% block submit%}
  {%endblock%}
</div>

{% endblock %}
